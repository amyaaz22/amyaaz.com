# Netlify only publishes the site/ folder. Everything else in this repo
# (docs/, README, business files) stays out of the public website.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Send www and the default Netlify subdomain to the canonical domain (helps SEO).
[[redirects]]
  from = "https://www.amyaaz.com/*"
  to = "https://amyaaz.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://melodic-daffodil-f0d054.netlify.app/*"
  to = "https://amyaaz.com/:splat"
  status = 301
  force = true
